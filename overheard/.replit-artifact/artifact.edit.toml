kind = "web"
  previewPath = "/"
  title = "Overheard"
  version = "1.0.0"

  [[services]]
  localPort = 8000
  name = "Overheard"
  paths = ["/"]

  [services.development]
  run = "cd /home/runner/workspace/overheard && python manage.py runserver 0.0.0.0:${PORT:-8000}"

  [services.production]

  [services.production.build]
  args = ["sh", "-c", "cd /home/runner/workspace/overheard && python manage.py collectstatic --noinput && python manage.py migrate --noinput"]

  [services.production.run]
  args = ["sh", "-c", "cd /home/runner/workspace/overheard && gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2"]

  [services.production.health.startup]
  path = "/"
  